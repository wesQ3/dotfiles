format = """
$username\
$hostname\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_status\
$aws\
$cmd_duration\
$line_break\
$character"""

[username]
format="[$user]($style)"

[hostname]
format="@[$hostname]($style) "

[directory]
format='[$read_only]($read_only_style)[$path]($style) '
read_only='#'
truncation_length = 0
style = "green"

[character]
success_symbol = "[❯](grey)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$symbol$branch]($style) "
style = "bright-yellow"

[git_commit]
style = "bright-green"

[git_status]
format = "[[($conflicted$untracked$modified$staged$renamed$deleted)](red) ($ahead_behind$stashed)]($style) "
style = "bright-green"
# conflicted = "​"
# untracked = "​"
# modified = "​"
# staged = "​"
# renamed = "​"
deleted = "x"
stashed = "​"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "bright-gray"

[aws]
symbol = " "
format = " [aws](italic) [$symbol$profile]($style) "
style = "#af5f00"
